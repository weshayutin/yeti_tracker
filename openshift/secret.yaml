apiVersion: v1
kind: Secret
metadata:
  name: yeti-db-credentials
  namespace: yeti-tracker
  labels:
    app: yeti-tracker
type: Opaque
stringData:
  # Required
  DB_HOST: "changeme"
  DB_USER: "changeme"
  DB_PASSWORD: "changeme"
  # Optional (defaults shown)
  DB_PORT: "3306"
  DB_NAME_NORTH: "f3denver"
  DB_NAME_SOUTH: "f3denversouth"
  DEFAULT_START_DATE: "2025-12-21"
  DEFAULT_END_DATE: "2026-03-20"
  SERVER_PORT: "8080"
